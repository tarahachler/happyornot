<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Happy Or Not</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="vote-area">
      <section class="buttons" id="buttonsArea">
        <button id="veryHappy">
          <img src="img/veryHappy.png" alt="Very Happy" />
        </button>
        <button id="happy">
          <img src="img/happy.png" alt="Happy" />
        </button>
        <button id="sad">
          <img src="img/sad.png" alt="Sad" />
        </button>
        <button id="verySad">
          <img src="img/verySad.png" alt="Very Sad" />
        </button>
      </section>

      <div id="phraseBox" class="phrase-box"></div>
    </div>

    <div id="result"></div>

    <script src="main.js"></script>
  </body>
</html>
