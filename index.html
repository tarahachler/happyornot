<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Happy Or Not</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="buttons">
      <button id="veryHappy">
        <img src="img/veryHappy.png" alt="Very Happy" />
      </button>
      <button id="happy">
        <img src="img/happy.png" alt="Happy" />
      </button>
      <button id="sad">
        <img src="img/sad.png" alt="Sad" />
      </button>
      <button id="verySad">
        <img src="img/verySad.png" alt="Very Sad" />
      </button>
    </section>
    <div id="result"></div>
  </body>
  <script src="main.js"></script>
</html>
